name: Run YT Mapping Initialization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-init:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: |
          pip install pandas google-api-python-client zhconv

      - name: 執行初始化腳本
        env:
          YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
        run: |
          python init_yt_mapping.py

      - name: 自動將產出的 CSV Commit 並推回 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: 雲端自動生成 YT ID 對照表與 Day 0 基準數據" || exit 0
          git push
