name: Run YT Mapping Initialization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-init:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: |
          pip install pandas google-api-python-client zhconv

      - name: 執行初始化腳本
        env:
          YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
        run: |
          python init_yt_mapping.py

      - name: Auto Commit & Push result
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto update: 每日榜單數據與 YouTube 對照表"
            git pull origin main --rebase
            git push
          fi
