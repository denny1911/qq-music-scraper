name: Run YT Mapping Initialization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-init:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: |
          # 👈 新增 google-generativeai 套件
          pip install pandas google-api-python-client google-generativeai zhconv

      - name: 執行初始化腳本
        env:
          YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          # 加入一個開關，在腳本內判斷是否執行重置
          SKIP_RESET: "true"
        run: |
          python init_yt_mapping.py

      - name: Run YT Mapping Initialization
        run: python init_yt_mapping.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add yt_mapping.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update song languages via Gemini API" && git push)
