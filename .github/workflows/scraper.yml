name: Daily QQ Music Scraper

on:
  schedule:
    # 每天台灣時間 16:30 執行 (對應 UTC 時間 04:30)
    - cron: '30 8 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 授權 Bot 可以自動將 CSV 檔案寫回 GitHub 倉庫

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        run: python scraper.py
        env:
          YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}

      - name: Auto Commit & Push result
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git pull origin main --rebase || true
          git diff-index --quiet HEAD || git commit -m "Auto update: 每日榜單數據與 YouTube 對照表"
          git push
