name: Daily QQ Music Scraper

on:
  schedule:
    # 每 10 分鐘執行一次
    - cron: '*/10 * * * *'
  workflow_dispatch: # 允許在網頁上手動點擊執行

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 授權 Bot 可以自動把資料存回 GitHub

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        run: python scraper.py
      
      - name: auto Commit & Push result
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff-index --quiet HEAD || git commit -m "Auto update: 抓取新歌榜數據"
          git push
      
      - name: Save and Commit Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update chart: $(date +'%Y-%m-%d')" && git push)
