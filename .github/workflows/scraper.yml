name: Daily QQ Music Scraper

on:
  schedule:
    # 每天台灣時間 24:00 執行 (對應 UTC 時間 16:00)
    - cron: '00 16 * * *'
    # 每月 1 號台灣時間 12:05 執行 (對應 UTC 時間 04:05，確保在 12 點以後)
    - cron: '05 04 1 * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        env:
          YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GSHEETS_SPREADSHEET_ID: ${{ secrets.GSHEETS_SPREADSHEET_ID }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python scraper.py

      - name: Auto Commit & Push result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update: 每日榜單數據與 YouTube 對照表" || exit 0
          git pull --rebase --autostash origin main
          git push origin main
