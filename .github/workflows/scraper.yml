name: Daily QQ Music Scraper

on:
  schedule:
    # 每天台灣時間 16:30 執行 (對應 UTC 時間 08:30)
    - cron: '30 8 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 授權 Bot 可以自動將 CSV 檔案寫回 GitHub 倉庫

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        env:
          YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }} # 👈 已將 API_KEYS 改為 GEMINI_API_KEYS
        run: python scraper.py

      - name: Auto Commit & Push result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update: 每日榜單數據與 YouTube 對照表" || exit 0
          git pull --rebase --autostash origin main
          git push origin main
